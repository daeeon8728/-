<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>설호 먹이주기 3D - 명예의 전당 (실시간 랭킹)</title>
  <meta name="description" content="설호 먹이주기 3D 실시간 랭킹 순위표! 전국 최고의 사육사들의 점수와 설호의 거대 몸무게를 확인하세요.">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Pretendard:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      --primary: #ff5722;
      --primary-hover: #f4511e;
      --accent: #ffb300;
      --gold: #ffd700;
      --silver: #c0c0c0;
      --bronze: #cd7f32;
      --bg-dark: #0e121d;
      --card-bg: rgba(22, 28, 44, 0.75);
      --border-glass: rgba(255, 255, 255, 0.12);
      --text: #ffffff;
      --text-muted: #90a4ae;
      --font-display: 'Jua', sans-serif;
      --font-body: 'Pretendard', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: radial-gradient(circle at 50% 0%, #1a233a 0%, var(--bg-dark) 75%);
      font-family: var(--font-body);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 40px;
    }

    /* Container */
    .container {
      width: 100%;
      max-width: 860px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Navigation & Top Bar */
    .top-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }

    .btn-back-game {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 18px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-glass);
      border-radius: 20px;
      color: #fff;
      text-decoration: none;
      font-family: var(--font-display);
      font-size: 13px;
      transition: all 0.2s ease;
      backdrop-filter: blur(8px);
    }

    .btn-back-game:hover {
      background: rgba(255, 255, 255, 0.16);
      transform: translateY(-2px);
    }

    .btn-refresh {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      background: linear-gradient(135deg, #ff5722, #ff9800);
      border: none;
      border-radius: 20px;
      color: #fff;
      font-family: var(--font-display);
      font-size: 13px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255, 87, 34, 0.35);
      transition: all 0.2s;
    }

    .btn-refresh:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(255, 87, 34, 0.5);
    }

    /* Header Section */
    .header-section {
      text-align: center;
      padding: 10px 0 16px;
    }

    .header-badge {
      display: inline-block;
      padding: 4px 12px;
      background: rgba(255, 179, 0, 0.15);
      border: 1px solid rgba(255, 179, 0, 0.35);
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 8px;
      letter-spacing: 0.5px;
    }

    .header-title {
      font-family: var(--font-display);
      font-size: 36px;
      color: #fff;
      text-shadow: 0 4px 15px rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .header-subtitle {
      font-size: 14px;
      color: var(--text-muted);
      margin-top: 6px;
    }

    /* Top 3 Podium Cards */
    .podium-container {
      display: grid;
      grid-template-columns: 1fr 1.15fr 1fr;
      gap: 14px;
      align-items: end;
      margin: 10px 0 20px;
    }

    .podium-card {
      background: var(--card-bg);
      border: 1px solid var(--border-glass);
      border-radius: 20px;
      padding: 20px 14px 16px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      backdrop-filter: blur(12px);
      transition: transform 0.25s ease;
    }

    .podium-card:hover {
      transform: translateY(-4px);
    }

    .podium-card.first {
      background: linear-gradient(180deg, rgba(255, 215, 0, 0.18) 0%, rgba(22, 28, 44, 0.85) 100%);
      border-color: rgba(255, 215, 0, 0.6);
      box-shadow: 0 10px 30px rgba(255, 215, 0, 0.2);
      padding-top: 28px;
      padding-bottom: 22px;
    }

    .podium-card.second {
      background: linear-gradient(180deg, rgba(192, 192, 192, 0.15) 0%, rgba(22, 28, 44, 0.8) 100%);
      border-color: rgba(192, 192, 192, 0.5);
    }

    .podium-card.third {
      background: linear-gradient(180deg, rgba(205, 127, 50, 0.15) 0%, rgba(22, 28, 44, 0.8) 100%);
      border-color: rgba(205, 127, 50, 0.5);
    }

    .podium-medal {
      font-size: 32px;
      margin-bottom: 6px;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.4));
    }

    .podium-card.first .podium-medal {
      font-size: 42px;
      animation: floatMedal 2.2s infinite ease-in-out;
    }

    @keyframes floatMedal {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    .podium-name {
      font-family: var(--font-display);
      font-size: 16px;
      font-weight: 800;
      color: #fff;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .podium-score {
      font-family: var(--font-display);
      font-size: 20px;
      color: #4dd0e1;
      margin-top: 4px;
    }

    .podium-card.first .podium-score {
      font-size: 24px;
      color: #ffd700;
      text-shadow: 0 0 12px rgba(255, 215, 0, 0.5);
    }

    .podium-meta {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 6px;
      display: flex;
      gap: 6px;
    }

    /* Filters & Search Toolbar */
    .toolbar-card {
      background: var(--card-bg);
      border: 1px solid var(--border-glass);
      border-radius: 18px;
      padding: 12px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      backdrop-filter: blur(10px);
    }

    .filter-tabs {
      display: flex;
      gap: 6px;
      overflow-x: auto;
    }

    .filter-tab {
      padding: 6px 14px;
      border-radius: 12px;
      border: 1px solid transparent;
      background: rgba(255, 255, 255, 0.05);
      color: #bbb;
      font-family: var(--font-display);
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .filter-tab.active, .filter-tab:hover {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
    }

    .filter-tab.active {
      background: linear-gradient(135deg, #ff5722, #ff9800);
      color: #fff;
      box-shadow: 0 2px 10px rgba(255, 87, 34, 0.4);
    }

    .search-input-box {
      display: flex;
      align-items: center;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 5px 12px;
      gap: 6px;
    }

    .search-input-box input {
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 12px;
      width: 130px;
    }

    /* Leaderboard Table / Card List */
    .table-container {
      background: var(--card-bg);
      border: 1px solid var(--border-glass);
      border-radius: 20px;
      overflow: hidden;
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    }

    .rank-table-header {
      display: grid;
      grid-template-columns: 60px 1.8fr 1.2fr 1fr 1fr 90px;
      padding: 14px 20px;
      background: rgba(255, 255, 255, 0.04);
      border-bottom: 1px solid var(--border-glass);
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      align-items: center;
    }

    .rank-rows-list {
      display: flex;
      flex-direction: column;
    }

    .rank-row {
      display: grid;
      grid-template-columns: 60px 1.8fr 1.2fr 1fr 1fr 90px;
      padding: 14px 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      align-items: center;
      font-size: 13px;
      transition: background 0.2s;
    }

    .rank-row:hover {
      background: rgba(255, 255, 255, 0.04);
    }

    .rank-row:last-child {
      border-bottom: none;
    }

    .col-rank {
      font-family: var(--font-display);
      font-size: 16px;
      font-weight: 800;
      display: flex;
      align-items: center;
    }

    .col-rank.rank-1 { color: #ffd700; font-size: 18px; }
    .col-rank.rank-2 { color: #c0c0c0; font-size: 18px; }
    .col-rank.rank-3 { color: #cd7f32; font-size: 18px; }

    .col-name {
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .stage-badge-pill {
      font-size: 10px;
      padding: 2px 7px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.1);
      color: #ffd54f;
      font-weight: 600;
    }

    .col-score {
      font-family: var(--font-display);
      font-size: 15px;
      color: #4dd0e1;
      font-weight: 700;
    }

    .col-weight {
      color: #ffca28;
      font-weight: 600;
    }

    .col-victims {
      color: #ff5252;
      font-weight: 600;
    }

    .col-date {
      font-size: 11px;
      color: var(--text-muted);
    }

    /* Empty & Loading states */
    .empty-state {
      padding: 50px 20px;
      text-align: center;
      color: var(--text-muted);
      font-size: 14px;
    }

    /* Footer Info */
    .footer-info {
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
      padding: 10px 0;
    }

    /* Mobile Responsive */
    @media (max-width: 700px) {
      .header-title {
        font-size: 26px;
      }
      .podium-container {
        grid-template-columns: 1fr;
        gap: 10px;
      }
      .podium-card.first {
        order: -1;
      }
      .toolbar-card {
        flex-direction: column;
        align-items: stretch;
      }
      .search-input-box {
        width: 100%;
      }
      .search-input-box input {
        width: 100%;
      }
      .rank-table-header {
        display: none;
      }
      .rank-row {
        grid-template-columns: 40px 1fr auto;
        gap: 8px;
        padding: 12px 14px;
      }
      .col-weight, .col-victims, .col-date {
        display: none;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Top Navigation -->
    <div class="top-nav">
      <a href="/" class="btn-back-game">
        <span>🐯</span>
        <span>설호 먹이주러 가기</span>
      </a>
      <button class="btn-refresh" id="btn-refresh-list">
        <span>🔄</span>
        <span>순위 새로고침</span>
      </button>
    </div>

    <!-- Header Section -->
    <div class="header-section">
      <div class="header-badge">UPSTASH KV LIVE LEADERBOARD</div>
      <h1 class="header-title">🐯 설호 명예의 전당</h1>
      <p class="header-subtitle">전국 최고의 호랑이 사육사들의 실시간 랭킹 순위표</p>
    </div>

    <!-- Top 3 Podium -->
    <div class="podium-container" id="podium-container">
      <!-- Injected via JS -->
    </div>

    <!-- Filter & Search Toolbar -->
    <div class="toolbar-card">
      <div class="filter-tabs">
        <button class="filter-tab active" data-filter="all">전체 순위</button>
        <button class="filter-tab" data-filter="동물원">🐯 동물원</button>
        <button class="filter-tab" data-filter="국회의사당">🏛️ 국회의사당</button>
        <button class="filter-tab" data-filter="대학교">🎓 대학교</button>
      </div>
      <div class="search-input-box">
        <span>🔍</span>
        <input type="text" id="search-input" placeholder="사육사 닉네임 검색">
      </div>
    </div>

    <!-- Leaderboard Table Container -->
    <div class="table-container">
      <div class="rank-table-header">
        <div>순위</div>
        <div>사육사 닉네임</div>
        <div>점수</div>
        <div>설호 몸무게</div>
        <div>희생된 인원</div>
        <div>등록 일시</div>
      </div>
      <div class="rank-rows-list" id="rank-rows-list">
        <div class="empty-state">실시간 순위표를 불러오는 중입니다...</div>
      </div>
    </div>

    <!-- Footer -->
    <div class="footer-info">
      국립 설호 동물원 • Upstash KV Canary Cave 연동 • Vercel Edge Powered
    </div>
  </div>

  <script>
    // State
    let allRankings = [];
    let currentFilter = 'all';
    let searchQuery = '';

    // Elements
    const podiumEl = document.getElementById('podium-container');
    const rowsListEl = document.getElementById('rank-rows-list');
    const refreshBtn = document.getElementById('btn-refresh-list');
    const searchInput = document.getElementById('search-input');

    // Fetch Leaderboard from /api/leaderboard
    async function fetchLeaderboard() {
      rowsListEl.innerHTML = '<div class="empty-state">실시간 순위표를 불러오는 중입니다...</div>';

      try {
        const res = await fetch('/api/leaderboard');
        const data = await res.json();
        allRankings = data.leaderboard || [];
        renderAll();
      } catch (err) {
        console.warn('API error, using fallback:', err);
        // Fallback demo data
        allRankings = [
          { rank: 1, name: '여의도_백호선생', score: 98500, weight: 485.5, victims: 52, stage: '국회의사당', date: '방금 전' },
          { rank: 2, name: '학점포기자', score: 76200, weight: 412.0, victims: 41, stage: '대학교', date: '10분 전' },
          { rank: 3, name: '부산상어친구', score: 64100, weight: 378.2, victims: 33, stage: '동물원', date: '30분 전' },
          { rank: 4, name: '대학원탈출넘버원', score: 51200, weight: 335.0, victims: 28, stage: '대학교', date: '1시간 전' },
          { rank: 5, name: '황금멧돼지사냥꾼', score: 43900, weight: 295.4, victims: 21, stage: '국회의사당', date: '2시간 전' },
          { rank: 6, name: '설호맘', score: 32000, weight: 268.0, victims: 14, stage: '동물원', date: '3시간 전' },
          { rank: 7, name: '치킨킬러', score: 21500, weight: 242.0, victims: 9, stage: '동물원', date: '5시간 전' }
        ];
        renderAll();
      }
    }

    // Filter & Search Logic
    function getFilteredList() {
      return allRankings.filter(item => {
        const matchesFilter = currentFilter === 'all' || (item.stage && item.stage.includes(currentFilter));
        const matchesSearch = !searchQuery || (item.name && item.name.toLowerCase().includes(searchQuery.toLowerCase()));
        return matchesFilter && matchesSearch;
      });
    }

    // Render Podium (Top 3)
    function renderPodium(list) {
      if (list.length === 0) {
        podiumEl.innerHTML = '';
        return;
      }

      const first = list[0];
      const second = list[1];
      const third = list[2];

      let html = '';

      // 2nd Place (Left)
      if (second) {
        html += `
          <div class="podium-card second">
            <div class="podium-medal">🥈</div>
            <div class="podium-name">${second.name}</div>
            <div class="podium-score">${Number(second.score).toLocaleString()}점</div>
            <div class="podium-meta">
              <span>🐯 ${Number(second.weight || 215).toFixed(1)}kg</span>
              <span>•</span>
              <span>😱 ${second.victims || 0}명</span>
            </div>
            <span class="stage-badge-pill" style="margin-top: 6px;">${second.stage || '동물원'}</span>
          </div>
        `;
      } else {
        html += '<div class="podium-card second" style="opacity: 0.3;">2위 대기중</div>';
      }

      // 1st Place (Center)
      if (first) {
        html += `
          <div class="podium-card first">
            <div class="podium-medal">👑🥇</div>
            <div class="podium-name" style="font-size: 18px; color: #ffd700;">${first.name}</div>
            <div class="podium-score">${Number(first.score).toLocaleString()}점</div>
            <div class="podium-meta">
              <span>🐯 ${Number(first.weight || 215).toFixed(1)}kg</span>
              <span>•</span>
              <span>😱 ${first.victims || 0}명</span>
            </div>
            <span class="stage-badge-pill" style="margin-top: 8px; background: rgba(255, 215, 0, 0.25); color: #ffd700;">${first.stage || '동물원'}</span>
          </div>
        `;
      }

      // 3rd Place (Right)
      if (third) {
        html += `
          <div class="podium-card third">
            <div class="podium-medal">🥉</div>
            <div class="podium-name">${third.name}</div>
            <div class="podium-score">${Number(third.score).toLocaleString()}점</div>
            <div class="podium-meta">
              <span>🐯 ${Number(third.weight || 215).toFixed(1)}kg</span>
              <span>•</span>
              <span>😱 ${third.victims || 0}명</span>
            </div>
            <span class="stage-badge-pill" style="margin-top: 6px;">${third.stage || '동물원'}</span>
          </div>
        `;
      } else {
        html += '<div class="podium-card third" style="opacity: 0.3;">3위 대기중</div>';
      }

      podiumEl.innerHTML = html;
    }

    // Render Full List
    function renderTable(list) {
      if (list.length === 0) {
        rowsListEl.innerHTML = '<div class="empty-state">해당 조건에 맞는 순위 기록이 없습니다.</div>';
        return;
      }

      rowsListEl.innerHTML = list.map((item, idx) => {
        const rank = idx + 1;
        let medal = rank;
        let rankClass = '';
        if (rank === 1) { medal = '🥇'; rankClass = 'rank-1'; }
        else if (rank === 2) { medal = '🥈'; rankClass = 'rank-2'; }
        else if (rank === 3) { medal = '🥉'; rankClass = 'rank-3'; }

        return `
          <div class="rank-row">
            <div class="col-rank ${rankClass}">${medal}</div>
            <div class="col-name">
              <span>${item.name}</span>
              <span class="stage-badge-pill">${item.stage || '동물원'}</span>
            </div>
            <div class="col-score">${Number(item.score).toLocaleString()}점</div>
            <div class="col-weight">${Number(item.weight || 215).toFixed(1)} kg</div>
            <div class="col-victims">${item.victims || 0} 명</div>
            <div class="col-date">${item.date || '최근'}</div>
          </div>
        `;
      }).join('');
    }

    function renderAll() {
      const list = getFilteredList();
      renderPodium(list);
      renderTable(list);
    }

    // Filter Buttons
    document.querySelectorAll('.filter-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        currentFilter = tab.getAttribute('data-filter');
        renderAll();
      });
    });

    // Search Input
    searchInput.addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderAll();
    });

    // Refresh Button
    refreshBtn.addEventListener('click', () => {
      fetchLeaderboard();
      confetti({ particleCount: 40, spread: 60 });
    });

    // Initial Load
    fetchLeaderboard();
  </script>
</body>
</html>
