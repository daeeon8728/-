<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>설호 먹이주기 3D - 명예의 전당 (실시간 랭킹)</title>
  <meta name="description" content="설호 먹이주기 3D 실시간 랭킹 순위표! 전국 최고의 사육사들의 점수와 설호의 거대 몸무게를 확인하세요.">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Pretendard:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      --primary: #ff5722;
      --primary-hover: #f4511e;
      --accent: #ffb300;
      --gold: #ffd700;
      --silver: #c0c0c0;
      --bronze: #cd7f32;
      --bg-dark: #0e121d;
      --card-bg: rgba(22, 28, 44, 0.75);
      --border-glass: rgba(255, 255, 255, 0.12);
      --text: #ffffff;
      --text-muted: #90a4ae;
      --font-display: 'Jua', sans-serif;
      --font-body: 'Pretendard', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: radial-gradient(circle at 50% 0%, #1a233a 0%, var(--bg-dark) 75%);
      font-family: var(--font-body);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 40px;
    }

    /* Container */
    .container {
      width: 100%;
      max-width: 860px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Navigation & Top Bar */
    .top-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }

    .btn-back-game {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 18px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-glass);
      border-radius: 20px;
      color: #fff;
      text-decoration: none;
      font-family: var(--font-display);
      font-size: 13px;
      transition: all 0.2s ease;
      backdrop-filter: blur(8px);
    }

    .btn-back-game:hover {
      background: rgba(255, 255, 255, 0.16);
      transform: translateY(-2px);
    }

    .btn-refresh {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      background: linear-gradient(135deg, #ff5722, #ff9800);
      border: none;
      border-radius: 20px;
      color: #fff;
      font-family: var(--font-display);
      font-size: 13px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255, 87, 34, 0.35);
      transition: all 0.2s;
    }

    .btn-refresh:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(255, 87, 34, 0.5);
    }

    /* Header Section */
    .header-section {
      text-align: center;
      padding: 10px 0 16px;
    }

    .header-badge {
      display: inline-block;
      padding: 4px 12px;
      background: rgba(255, 179, 0, 0.15);
      border: 1px solid rgba(255, 179, 0, 0.35);
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 8px;
      letter-spacing: 0.5px;
    }

    .header-title {
      font-family: var(--font-display);
      font-size: 36px;
      color: #fff;
      text-shadow: 0 4px 15px rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .header-subtitle {
      font-size: 14px;
      color: var(--text-muted);
      margin-top: 6px;
    }

    /* Top 3 Podium Cards */
    .podium-container {
      display: grid;
      grid-template-columns: 1fr 1.15fr 1fr;
      gap: 14px;
      align-items: end;
      margin: 10px 0 20px;
    }

    .podium-card {
      background: var(--card-bg);
      border: 1px solid var(--border-glass);
      border-radius: 20px;
      padding: 20px 14px 16px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      backdrop-filter: blur(12px);
      transition: transform 0.25s ease;
    }

    .podium-card:hover {
      transform: translateY(-4px);
    }

    .podium-card.first {
      background: linear-gradient(180deg, rgba(255, 215, 0, 0.18) 0%, rgba(22, 28, 44, 0.85) 100%);
      border-color: rgba(255, 215, 0, 0.6);
      box-shadow: 0 10px 30px rgba(255, 215, 0, 0.2);
      padding-top: 28px;
      padding-bottom: 22px;
    }

    .podium-card.second {
      background: linear-gradient(180deg, rgba(192, 192, 192, 0.15) 0%, rgba(22, 28, 44, 0.8) 100%);
      border-color: rgba(192, 192, 192, 0.5);
    }

    .podium-card.third {
      background: linear-gradient(180deg, rgba(205, 127, 50, 0.15) 0%, rgba(22, 28, 44, 0.8) 100%);
      border-color: rgba(205, 127, 50, 0.5);
    }

    .podium-medal {
      font-size: 32px;
      margin-bottom: 6px;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.4));
    }

    .podium-card.first .podium-medal {
      font-size: 42px;
      animation: floatMedal 2.2s infinite ease-in-out;
    }

    @keyframes floatMedal {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    .podium-name {
      font-family: var(--font-display);
      font-size: 16px;
      font-weight: 800;
      color: #fff;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .podium-score {
      font-family: var(--font-display);
      font-size: 20px;
      color: #4dd0e1;
      margin-top: 4px;
    }

    .podium-card.first .podium-score {
      font-size: 24px;
      color: #ffd700;
      text-shadow: 0 0 12px rgba(255, 215, 0, 0.5);
    }

    .podium-meta {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 6px;
      display: flex;
      gap: 6px;
    }

    /* Filters & Search Toolbar */
    .toolbar-card {
      background: var(--card-bg);
      border: 1px solid var(--border-glass);
      border-radius: 18px;
      padding: 12px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      backdrop-filter: blur(10px);
    }

    .filter-tabs {
      display: flex;
      gap: 6px;
      overflow-x: auto;
    }

    .filter-tab {
      padding: 6px 14px;
      border-radius: 12px;
      border: 1px solid transparent;
      background: rgba(255, 255, 255, 0.05);
      color: #bbb;
      font-family: var(--font-display);
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .filter-tab.active, .filter-tab:hover {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
    }

    .filter-tab.active {
      background: linear-gradient(135deg, #ff5722, #ff9800);
      color: #fff;
      box-shadow: 0 2px 10px rgba(255, 87, 34, 0.4);
    }

    .search-input-box {
      display: flex;
      align-items: center;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 5px 12px;
      gap: 6px;
    }

    .search-input-box input {
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 12px;
      width: 130px;
    }

    /* Leaderboard Table / Card List */
    .table-container {
      background: var(--card-bg);
      border: 1px solid var(--border-glass);
      border-radius: 20px;
      overflow: hidden;
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    }

    .rank-table-header {
      display: grid;
      grid-template-columns: 60px 1.8fr 1.2fr 1fr 1fr 90px;
      padding: 14px 20px;
      background: rgba(255, 255, 255, 0.04);
      border-bottom: 1px solid var(--border-glass);
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      align-items: center;
    }

    .rank-rows-list {
      display: flex;
      flex-direction: column;
    }

    .rank-row {
      display: grid;
      grid-template-columns: 60px 1.8fr 1.2fr 1fr 1fr 90px;
      padding: 14px 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      align-items: center;
      font-size: 13px;
      transition: background 0.2s;
    }

    .rank-row:hover {
      background: rgba(255, 255, 255, 0.04);
    }

    .rank-row:last-child {
      border-bottom: none;
    }

    .col-rank {
      font-family: var(--font-display);
      font-size: 16px;
      font-weight: 800;
      display: flex;
      align-items: center;
    }

    .col-rank.rank-1 { color: #ffd700; font-size: 18px; }
    .col-rank.rank-2 { color: #c0c0c0; font-size: 18px; }
    .col-rank.rank-3 { color: #cd7f32; font-size: 18px; }

    .col-name {
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .stage-badge-pill {
      font-size: 10px;
      padding: 2px 7px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.1);
      color: #ffd54f;
      font-weight: 600;
    }

    .col-score {
      font-family: var(--font-display);
      font-size: 15px;
      color: #4dd0e1;
      font-weight: 700;
    }

    .col-weight {
      color: #ffca28;
      font-weight: 600;
    }

    .col-victims {
      color: #ff5252;
      font-weight: 600;
    }

    .col-date {
      font-size: 11px;
      color: var(--text-muted);
    }

    /* Empty & Loading states */
    .empty-state {
      padding: 50px 20px;
      text-align: center;
      color: var(--text-muted);
      font-size: 14px;
    }

    /* My Rank Status Card */
    .my-rank-card {
      background: linear-gradient(135deg, rgba(255, 152, 0, 0.18), rgba(22, 28, 44, 0.95));
      border: 2px solid rgba(255, 179, 0, 0.65);
      border-radius: 20px;
      padding: 16px 20px;
      margin-bottom: 24px;
      backdrop-filter: blur(14px);
      box-shadow: 0 10px 30px rgba(255, 152, 0, 0.2);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .my-rank-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .my-rank-title {
      font-family: var(--font-display);
      font-size: 18px;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .my-rank-highlight {
      font-family: var(--font-display);
      font-size: 20px;
      color: #ffd700;
      text-shadow: 0 0 12px rgba(255, 215, 0, 0.6);
    }

    .my-rank-stats {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .my-rank-chip {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      padding: 5px 12px;
      font-size: 13px;
      color: #eceff1;
    }

    .my-rank-chip b {
      color: #4dd0e1;
    }

    .live-sync-badge {
      font-size: 11px;
      color: #69f0ae;
      background: rgba(105, 240, 174, 0.15);
      border: 1px solid #69f0ae;
      padding: 4px 10px;
      border-radius: 12px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .my-rank-form {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .my-rank-input {
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 12px;
      color: #fff;
      padding: 8px 14px;
      font-size: 14px;
      outline: none;
      min-width: 220px;
    }

    .my-rank-input:focus {
      border-color: #ff9800;
      box-shadow: 0 0 10px rgba(255, 152, 0, 0.5);
    }

    .btn-rank-action {
      background: linear-gradient(135deg, #ff9800, #ff5722);
      border: none;
      color: #fff;
      font-family: var(--font-display);
      font-size: 13px;
      padding: 8px 18px;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .btn-rank-action:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(255, 87, 34, 0.6);
    }

    .rank-row.my-row {
      background: rgba(255, 215, 0, 0.16) !important;
      border: 2px solid #ffd700 !important;
      box-shadow: 0 0 15px rgba(255, 215, 0, 0.3) !important;
    }

    /* Footer Info */
    .footer-info {
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
      padding: 10px 0;
    }

    /* Mobile Responsive */
    @media (max-width: 700px) {
      .header-title {
        font-size: 26px;
      }
      .podium-container {
        grid-template-columns: 1fr;
        gap: 10px;
      }
      .podium-card.first {
        order: -1;
      }
      .toolbar-card {
        flex-direction: column;
        align-items: stretch;
      }
      .search-input-box {
        width: 100%;
      }
      .search-input-box input {
        width: 100%;
      }
      .rank-table-header {
        display: none;
      }
      .rank-row {
        grid-template-columns: 40px 1fr auto;
        gap: 8px;
        padding: 12px 14px;
      }
      .col-weight, .col-victims, .col-date {
        display: none;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Top Navigation -->
    <div class="top-nav">
      <a href="/" class="btn-back-game">
        <span>🐯</span>
        <span>설호 먹이주러 가기</span>
      </a>
      <button class="btn-refresh" id="btn-refresh-list">
        <span>🔄</span>
        <span>순위 새로고침</span>
      </button>
    </div>

    <!-- Header Section -->
    <div class="header-section">
      <div class="header-badge">UPSTASH KV LIVE LEADERBOARD</div>
      <h1 class="header-title">🐯 설호 명예의 전당</h1>
      <p class="header-subtitle">전국 최고의 호랑이 사육사들의 실시간 랭킹 순위표</p>
    </div>

    <!-- My Live Rank Card (Interactive Nickname & Score) -->
    <div class="my-rank-card" id="my-rank-card">
      <div style="font-size: 13px; color: #ffd54f;">내 사육사 랭킹 상태를 불러오는 중...</div>
    </div>

    <!-- Top 3 Podium -->
    <div class="podium-container" id="podium-container">
      <!-- Injected via JS -->
    </div>

    <!-- Filter & Search Toolbar -->
    <div class="toolbar-card">
      <div class="filter-tabs">
        <button class="filter-tab active" data-filter="all">전체 순위</button>
        <button class="filter-tab" data-filter="동물원">🐯 동물원</button>
        <button class="filter-tab" data-filter="국회의사당">🏛️ 국회의사당</button>
        <button class="filter-tab" data-filter="대학교">🎓 대학교</button>
      </div>
      <div class="search-input-box">
        <span>🔍</span>
        <input type="text" id="search-input" placeholder="사육사 닉네임 검색">
      </div>
    </div>

    <!-- Leaderboard Table Container -->
    <div class="table-container">
      <div class="rank-table-header">
        <div>순위</div>
        <div>사육사 닉네임</div>
        <div>점수</div>
        <div>설호 몸무게</div>
        <div>희생된 인원</div>
        <div>등록 일시</div>
      </div>
      <div class="rank-rows-list" id="rank-rows-list">
        <div class="empty-state">실시간 순위표를 불러오는 중입니다...</div>
      </div>
    </div>

    <!-- Footer -->
    <div class="footer-info">
      국립 설호 동물원 • Upstash KV Canary Cave 연동 • Vercel Edge Powered
    </div>
  </div>

  <script>
    // State
    let allRankings = [];
    let currentFilter = 'all';
    let searchQuery = '';
    let playerNickname = localStorage.getItem('seolho_player_nickname') || '';
    let isLiveServerConnected = true;

    // Elements
    const myRankCardEl = document.getElementById('my-rank-card');
    const podiumEl = document.getElementById('podium-container');
    const rowsListEl = document.getElementById('rank-rows-list');
    const refreshBtn = document.getElementById('btn-refresh-list');
    const searchInput = document.getElementById('search-input');

    // Helper: read latest local stats from seolho_save_v2 and seolho_my_rank_entry
    function getMyLocalStats() {
      let score = 0;
      let weight = 215.0;
      let victims = 0;
      let stage = '동물원';

      try {
        const myEntry = JSON.parse(localStorage.getItem('seolho_my_rank_entry') || 'null');
        if (myEntry) {
          score = Number(myEntry.score) || 0;
          weight = Number(myEntry.weight) || 215.0;
          victims = Number(myEntry.victims) || 0;
          stage = myEntry.stage || '동물원';
        }
      } catch (e) {}

      try {
        const gameSave = JSON.parse(localStorage.getItem('seolho_save_v2') || 'null');
        if (gameSave) {
          if (typeof gameSave.totalScore === 'number') score = Math.max(score, gameSave.totalScore);
          if (typeof gameSave.weight === 'number') weight = gameSave.weight;
          if (typeof gameSave.victimsCount === 'number') victims = Math.max(victims, gameSave.victimsCount);
          const stageMap = { zoo: '동물원', assembly: '국회의사당', university: '대학교' };
          if (gameSave.currentStage && stageMap[gameSave.currentStage]) {
            stage = stageMap[gameSave.currentStage];
          }
        }
      } catch (e) {}

      return { score, weight, victims, stage };
    }

    // Render My Rank Status Card
    function renderMyRankCard() {
      const stats = getMyLocalStats();
      playerNickname = localStorage.getItem('seolho_player_nickname') || '';

      if (playerNickname) {
        // Find player's position in allRankings
        const foundIdx = allRankings.findIndex(r => r.name === playerNickname);
        const myRank = foundIdx >= 0 ? allRankings[foundIdx].rank : (allRankings.length + 1);
        const myScore = foundIdx >= 0 ? allRankings[foundIdx].score : stats.score;
        const myWeight = foundIdx >= 0 && allRankings[foundIdx].weight ? allRankings[foundIdx].weight : stats.weight;
        const myVictims = foundIdx >= 0 && allRankings[foundIdx].victims ? allRankings[foundIdx].victims : stats.victims;
        const myStage = foundIdx >= 0 && allRankings[foundIdx].stage ? allRankings[foundIdx].stage : stats.stage;

        myRankCardEl.innerHTML = `
          <div class="my-rank-header">
            <div class="my-rank-title">
              <span>👤 사육사:</span>
              <span style="color: #ffd54f; font-weight: 800;">${playerNickname}</span>
              <span class="live-sync-badge" style="${isLiveServerConnected ? '' : 'background: rgba(255, 152, 0, 0.2); border-color: #ff9800; color: #ffb74d;'}">
                ${isLiveServerConnected ? '🟢 전세계 실시간 연동 중' : '⚠️ 기기 로컬 모드 (서버 미연동)'}
              </span>
            </div>
            <div style="display: flex; gap: 8px; align-items: center;">
              <button class="btn-rank-action" id="btn-toggle-edit" style="background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.25);">✏️ 닉네임 변경</button>
            </div>
          </div>
          
          <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
            <div class="my-rank-title">
              <span>현재 내 실시간 순위:</span>
              <span class="my-rank-highlight">🏆 ${myRank}위</span>
            </div>
            <div class="my-rank-stats">
              <span class="my-rank-chip">🎯 <b>${Number(myScore).toLocaleString()}점</b></span>
              <span class="my-rank-chip">🐯 <b>${Number(myWeight).toFixed(1)}kg</b></span>
              <span class="my-rank-chip">😱 <b>${myVictims}명</b></span>
              <span class="my-rank-chip">📍 <b>${myStage}</b></span>
            </div>
          </div>

          <!-- Edit Form (Hidden by default) -->
          <div class="my-rank-form" id="edit-nick-form" style="display: none; margin-top: 6px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,0.1);">
            <span style="font-size: 13px; color: #cfd8dc;">새 닉네임:</span>
            <input type="text" id="edit-nick-input" class="my-rank-input" value="${playerNickname}" maxlength="10">
            <button class="btn-rank-action" id="btn-save-nick">저장 및 랭킹 갱신</button>
            <button class="btn-rank-action" id="btn-cancel-edit" style="background: rgba(255,255,255,0.15);">취소</button>
          </div>
        `;

        document.getElementById('btn-toggle-edit').addEventListener('click', () => {
          const form = document.getElementById('edit-nick-form');
          form.style.display = form.style.display === 'none' ? 'flex' : 'none';
          if (form.style.display === 'flex') document.getElementById('edit-nick-input').focus();
        });

        document.getElementById('btn-cancel-edit').addEventListener('click', () => {
          document.getElementById('edit-nick-form').style.display = 'none';
        });

        document.getElementById('btn-save-nick').addEventListener('click', () => {
          const input = document.getElementById('edit-nick-input');
          handleNicknameUpdate(input.value);
        });

        document.getElementById('edit-nick-input').addEventListener('keydown', (e) => {
          if (e.key === 'Enter') {
            const input = document.getElementById('edit-nick-input');
            handleNicknameUpdate(input.value);
          }
        });

      } else {
        // Not registered yet
        myRankCardEl.innerHTML = `
          <div class="my-rank-header">
            <div class="my-rank-title">
              <span>🐯 아직 순위표에 닉네임이 등록되지 않았습니다!</span>
            </div>
            <span style="font-size: 12px; color: #ffd54f;">현재 내 게임 기록: ${stats.score.toLocaleString()}점 • ${stats.weight.toFixed(1)}kg</span>
          </div>
          <p style="font-size: 13px; color: #cfd8dc; line-height: 1.5;">
            사육사 닉네임을 1회 등록하면, 다른 기기에서도 점수가 실시간 순위표에 계속 자동 갱신됩니다!
          </p>
          <div class="my-rank-form" style="margin-top: 4px;">
            <input type="text" id="reg-nick-input" class="my-rank-input" placeholder="사육사 닉네임 입력 (최대 10자)" maxlength="10">
            <button class="btn-rank-action" id="btn-submit-reg">🏆 내 점수 랭킹에 등록하기</button>
          </div>
        `;

        document.getElementById('btn-submit-reg').addEventListener('click', () => {
          const input = document.getElementById('reg-nick-input');
          handleNicknameUpdate(input.value);
        });

        document.getElementById('reg-nick-input').addEventListener('keydown', (e) => {
          if (e.key === 'Enter') {
            const input = document.getElementById('reg-nick-input');
            handleNicknameUpdate(input.value);
          }
        });
      }
    }

    // Direct Upstash REST API credentials for guaranteed multi-device cloud sync
    const UPSTASH_REST_URL = 'https://communal-foxhound-121640.upstash.io';
    const UPSTASH_REST_TOKEN = 'gQAAAAAAAdsoAAIgcDFmOTJmYzE4ZmZmZGU0OTk4OTliYzYzYzYyMzc4MmE1Yw';

    async function directUpstashFetchLeaderboard() {
      try {
        const zres = await fetch(UPSTASH_REST_URL, {
          method: 'POST',
          headers: {
            'Authorization': 'Bearer ' + UPSTASH_REST_TOKEN,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(['ZREVRANGE', 'seolho_leaderboard_v3', '0', '49', 'WITHSCORES'])
        });
        const zdata = await zres.json();
        const rawList = zdata.result || [];
        if (!Array.isArray(rawList) || rawList.length === 0) return null;

        const names = [];
        const scores = [];
        for (let i = 0; i < rawList.length; i += 2) {
          names.push(rawList[i]);
          scores.push(Number(rawList[i + 1]));
        }

        let metaMap = {};
        if (names.length > 0) {
          try {
            const mres = await fetch(UPSTASH_REST_URL, {
              method: 'POST',
              headers: {
                'Authorization': 'Bearer ' + UPSTASH_REST_TOKEN,
                'Content-Type': 'application/json'
              },
              body: JSON.stringify(['HMGET', 'seolho_player_meta_v3', ...names])
            });
            const mdata = await mres.json();
            const metaArr = mdata.result || [];
            names.forEach((name, idx) => {
              if (metaArr[idx]) {
                try { metaMap[name] = JSON.parse(metaArr[idx]); } catch (e) {}
              }
            });
          } catch (e) {}
        }

        return names.map((name, idx) => {
          const meta = metaMap[name] || {};
          return {
            rank: idx + 1,
            name: name,
            score: scores[idx] || meta.score || 0,
            weight: meta.weight || 215.0,
            victims: meta.victims || 0,
            stage: meta.stage || '동물원',
            date: meta.date || '최근'
          };
        });
      } catch (err) {
        console.warn('Direct Upstash fetch error:', err);
        return null;
      }
    }

    async function directUpstashSaveScore(entry) {
      try {
        const scoreVal = Math.floor(Number(entry.score));
        const cleanName = (entry.name || '익명 사육사').trim().slice(0, 15);
        const metaPayload = JSON.stringify({
          name: cleanName,
          score: scoreVal,
          weight: Number(entry.weight || 215.0),
          victims: Number(entry.victims || 0),
          stage: entry.stage || '동물원',
          date: new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' }),
          timestamp: Date.now()
        });

        await fetch(UPSTASH_REST_URL, {
          method: 'POST',
          headers: {
            'Authorization': 'Bearer ' + UPSTASH_REST_TOKEN,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(['ZADD', 'seolho_leaderboard_v3', String(scoreVal), cleanName])
        });

        await fetch(UPSTASH_REST_URL, {
          method: 'POST',
          headers: {
            'Authorization': 'Bearer ' + UPSTASH_REST_TOKEN,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(['HSET', 'seolho_player_meta_v3', cleanName, metaPayload])
        });

        return true;
      } catch (err) {
        console.warn('Direct Upstash save error:', err);
        return false;
      }
    }

    // Handle Nickname Registration or Update
    async function handleNicknameUpdate(newNick) {
      const cleanNick = (newNick || '').trim();
      if (!cleanNick) {
        alert('닉네임을 입력해주세요!');
        return;
      }

      playerNickname = cleanNick;
      localStorage.setItem('seolho_player_nickname', cleanNick);

      const stats = getMyLocalStats();
      const myEntry = {
        name: cleanNick,
        score: stats.score,
        weight: stats.weight,
        victims: stats.victims,
        stage: stats.stage,
        date: '방금 전',
        timestamp: Date.now()
      };
      localStorage.setItem('seolho_my_rank_entry', JSON.stringify(myEntry));

      let synced = false;
      // 1. Try serverless / local server API
      try {
        const res = await fetch('/api/leaderboard', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name: cleanNick,
            score: stats.score,
            weight: stats.weight,
            victims: stats.victims,
            stage: stats.stage
          })
        });
        if (res.ok) {
          const data = await res.json();
          if (data.isLiveServer !== false) synced = true;
        }
      } catch (e) {}

      // 2. Direct Upstash fallback if server endpoint unavailable or failed
      if (!synced) {
        synced = await directUpstashSaveScore({
          name: cleanNick,
          score: stats.score,
          weight: stats.weight,
          victims: stats.victims,
          stage: stats.stage
        });
      }

      isLiveServerConnected = synced;
      if (synced) {
        alert(`🎉 [${cleanNick}] 사육사님 등록 완료!\n다른 폰에서도 점수와 랭킹이 실시간으로 즉시 연동됩니다!`);
      } else {
        alert(`[${cleanNick}] 등록 완료! (로컬 저장됨)`);
      }

      confetti({ particleCount: 100, spread: 80 });
      fetchLeaderboard();
    }

    // Fetch Leaderboard with Guaranteed Local & Remote Merging
    async function fetchLeaderboard() {
      rowsListEl.innerHTML = '<div class="empty-state">실시간 순위표를 불러오는 중입니다...</div>';

      // 1. Load local base rankings
      let localList = [
        { name: '여의도_백호선생', score: 98500, weight: 485.5, victims: 52, stage: '국회의사당', date: '방금 전' },
        { name: '학점포기자', score: 76200, weight: 412.0, victims: 41, stage: '대학교', date: '10분 전' },
        { name: '부산상어친구', score: 64100, weight: 378.2, victims: 33, stage: '동물원', date: '30분 전' },
        { name: '대학원탈출넘버원', score: 51200, weight: 335.0, victims: 28, stage: '대학교', date: '1시간 전' },
        { name: '황금멧돼지사냥꾼', score: 43900, weight: 295.4, victims: 21, stage: '국회의사당', date: '2시간 전' },
        { name: '설호맘', score: 32000, weight: 268.0, victims: 14, stage: '동물원', date: '3시간 전' },
        { name: '치킨킬러', score: 21500, weight: 242.0, victims: 9, stage: '동물원', date: '5시간 전' }
      ];
      try {
        const stored = JSON.parse(localStorage.getItem('seolho_local_leaderboard') || '[]');
        if (Array.isArray(stored) && stored.length > 0) localList = stored;
      } catch (e) {}

      const stats = getMyLocalStats();
      playerNickname = localStorage.getItem('seolho_player_nickname') || '';

      // 2. Fetch remote leaderboard (API or Direct Upstash)
      let list = null;
      try {
        const res = await fetch('/api/leaderboard');
        if (res.ok) {
          const data = await res.json();
          if (data.isLiveServer !== false && Array.isArray(data.leaderboard) && data.leaderboard.length > 0) {
            list = data.leaderboard;
            isLiveServerConnected = true;
          }
        }
      } catch (err) {}

      if (!list) {
        // Direct Upstash REST API Fallback
        const upstashList = await directUpstashFetchLeaderboard();
        if (upstashList && Array.isArray(upstashList) && upstashList.length > 0) {
          list = upstashList;
          isLiveServerConnected = true;
        }
      }

      if (list && list.length > 0) {
        // Merge with default mock entries for full podium
        const existingNames = new Set(list.map(p => p.name));
        const merged = [...list];
        for (const def of localList) {
          if (!existingNames.has(def.name)) {
            merged.push(def);
          }
        }
        list = merged;
      } else {
        list = localList;
        isLiveServerConnected = false;
      }

      // 3. Guarantee that player's nickname is present and has the up-to-date score
      if (playerNickname) {
        const myIdx = list.findIndex(item => item.name === playerNickname);
        const bestScore = Math.max(myIdx >= 0 ? (list[myIdx].score || 0) : 0, stats.score);
        const myEntry = {
          name: playerNickname,
          score: bestScore,
          weight: stats.weight,
          victims: stats.victims,
          stage: stats.stage,
          date: '방금 전'
        };

        if (myIdx >= 0) {
          list[myIdx] = { ...list[myIdx], ...myEntry };
        } else {
          list.push(myEntry);
        }
      }

      // 4. Sort strictly descending by score
      list.sort((a, b) => (Number(b.score) || 0) - (Number(a.score) || 0));

      // 5. Assign exact rank numbers 1, 2, 3...
      allRankings = list.map((item, idx) => ({
        ...item,
        rank: idx + 1,
        score: Number(item.score) || 0,
        weight: Number(item.weight) || 215.0,
        victims: Number(item.victims) || 0
      }));

      // Cache back to local storage
      try {
        localStorage.setItem('seolho_local_leaderboard', JSON.stringify(allRankings));
      } catch (e) {}

      renderMyRankCard();
      renderAll();
    }

    // Filter & Search Logic
    function getFilteredList() {
      return allRankings.filter(item => {
        const matchesFilter = currentFilter === 'all' || (item.stage && item.stage.includes(currentFilter));
        const matchesSearch = !searchQuery || (item.name && item.name.toLowerCase().includes(searchQuery.toLowerCase()));
        return matchesFilter && matchesSearch;
      });
    }

    // Render Podium (Top 3)
    function renderPodium(list) {
      if (list.length === 0) {
        podiumEl.innerHTML = '';
        return;
      }

      const first = list[0];
      const second = list[1];
      const third = list[2];

      let html = '';

      // 2nd Place (Left)
      if (second) {
        const isMe2 = playerNickname && second.name === playerNickname;
        html += `
          <div class="podium-card second" style="${isMe2 ? 'border: 2px solid #ffd700; box-shadow: 0 0 20px rgba(255, 215, 0, 0.4);' : ''}">
            <div class="podium-medal">🥈</div>
            <div class="podium-name">${second.name} ${isMe2 ? '<span style="font-size: 11px; color: #ffd700;">(나)</span>' : ''}</div>
            <div class="podium-score">${Number(second.score).toLocaleString()}점</div>
            <div class="podium-meta">
              <span>🐯 ${Number(second.weight || 215).toFixed(1)}kg</span>
              <span>•</span>
              <span>😱 ${second.victims || 0}명</span>
            </div>
            <span class="stage-badge-pill" style="margin-top: 6px;">${second.stage || '동물원'}</span>
          </div>
        `;
      } else {
        html += '<div class="podium-card second" style="opacity: 0.3;">2위 대기중</div>';
      }

      // 1st Place (Center)
      if (first) {
        const isMe1 = playerNickname && first.name === playerNickname;
        html += `
          <div class="podium-card first" style="${isMe1 ? 'border: 3px solid #ffea00; box-shadow: 0 0 30px rgba(255, 234, 0, 0.6);' : ''}">
            <div class="podium-medal">👑🥇</div>
            <div class="podium-name" style="font-size: 18px; color: #ffd700;">${first.name} ${isMe1 ? '<span style="font-size: 13px; color: #fff; background: rgba(0,0,0,0.5); padding: 2px 6px; border-radius: 6px;">(나)</span>' : ''}</div>
            <div class="podium-score">${Number(first.score).toLocaleString()}점</div>
            <div class="podium-meta">
              <span>🐯 ${Number(first.weight || 215).toFixed(1)}kg</span>
              <span>•</span>
              <span>😱 ${first.victims || 0}명</span>
            </div>
            <span class="stage-badge-pill" style="margin-top: 8px; background: rgba(255, 215, 0, 0.25); color: #ffd700;">${first.stage || '동물원'}</span>
          </div>
        `;
      }

      // 3rd Place (Right)
      if (third) {
        const isMe3 = playerNickname && third.name === playerNickname;
        html += `
          <div class="podium-card third" style="${isMe3 ? 'border: 2px solid #ffd700; box-shadow: 0 0 20px rgba(255, 215, 0, 0.4);' : ''}">
            <div class="podium-medal">🥉</div>
            <div class="podium-name">${third.name} ${isMe3 ? '<span style="font-size: 11px; color: #ffd700;">(나)</span>' : ''}</div>
            <div class="podium-score">${Number(third.score).toLocaleString()}점</div>
            <div class="podium-meta">
              <span>🐯 ${Number(third.weight || 215).toFixed(1)}kg</span>
              <span>•</span>
              <span>😱 ${third.victims || 0}명</span>
            </div>
            <span class="stage-badge-pill" style="margin-top: 6px;">${third.stage || '동물원'}</span>
          </div>
        `;
      } else {
        html += '<div class="podium-card third" style="opacity: 0.3;">3위 대기중</div>';
      }

      podiumEl.innerHTML = html;
    }

    // Render Full List
    function renderTable(list) {
      if (list.length === 0) {
        rowsListEl.innerHTML = '<div class="empty-state">해당 조건에 맞는 순위 기록이 없습니다.</div>';
        return;
      }

      rowsListEl.innerHTML = list.map((item) => {
        const rank = item.rank;
        const isMe = playerNickname && item.name === playerNickname;
        let medal = rank;
        let rankClass = '';
        if (rank === 1) { medal = '🥇'; rankClass = 'rank-1'; }
        else if (rank === 2) { medal = '🥈'; rankClass = 'rank-2'; }
        else if (rank === 3) { medal = '🥉'; rankClass = 'rank-3'; }

        return `
          <div class="rank-row ${isMe ? 'my-row' : ''}">
            <div class="col-rank ${rankClass}">${medal}</div>
            <div class="col-name">
              <span>${item.name}</span>
              ${isMe ? '<b style="color: #ffd700; font-size: 11px; margin-left: 6px; background: rgba(0,0,0,0.5); padding: 2px 7px; border-radius: 8px;">👤 나</b>' : ''}
              <span class="stage-badge-pill">${item.stage || '동물원'}</span>
            </div>
            <div class="col-score">${Number(item.score).toLocaleString()}점</div>
            <div class="col-weight">${Number(item.weight || 215).toFixed(1)} kg</div>
            <div class="col-victims">${item.victims || 0} 명</div>
            <div class="col-date">${item.date || '최근'}</div>
          </div>
        `;
      }).join('');
    }

    function renderAll() {
      const list = getFilteredList();
      renderPodium(list);
      renderTable(list);
    }

    // Filter Buttons
    document.querySelectorAll('.filter-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        currentFilter = tab.getAttribute('data-filter');
        renderAll();
      });
    });

    // Search Input
    searchInput.addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderAll();
    });

    // Refresh Button
    refreshBtn.addEventListener('click', () => {
      fetchLeaderboard();
      confetti({ particleCount: 40, spread: 60 });
    });

    // Initial Load
    fetchLeaderboard();
  </script>
</body>
